# AWS Amplify Hosting build for the front end (monorepo: the app is in client/).
# In the Amplify console set these environment variables from the SAM outputs:
#   NEXT_PUBLIC_API_BASE_URL, NEXT_PUBLIC_AWS_REGION,
#   NEXT_PUBLIC_COGNITO_USER_POOL_ID, NEXT_PUBLIC_COGNITO_CLIENT_ID
version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || true
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
