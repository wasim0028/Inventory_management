# Run the whole app locally:  docker compose up --build
#   Website  http://localhost:3000   (local mode, no sign-in)
#   API      http://localhost:8000
# Load demo data once (deletes existing data):  docker compose exec server npm run seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/inventory?schema=public"
      PORT: 8000
      AUTH_DISABLED: "true"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  db-data:
