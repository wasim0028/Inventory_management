# Checks every pull request that touches the infrastructure or the API:
# formatting, validation, offline tests, lint, security scan, then a real plan
# for dev and prod (read-only AWS role), posted as a PR comment.
name: Terraform PR checks

on:
  pull_request:
    paths:
      - "infra/**"
      - "server/**"
      - ".github/workflows/terraform-pr.yml"

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS
  pull-requests: write # plan comments

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-south-1

jobs:
  static:
    name: fmt, validate, test, tflint, checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate and offline tests
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/envs/dev infra/envs/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then terraform -chdir="$dir" test; fi
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS plugin
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          compact: true

  plan:
    name: plan (${{ matrix.environment }})
    needs: static
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets or AWS access, so skip the plan.
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_github_access_token: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Build the Lambda bundle (Terraform zips server/dist)
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform plan
        id: plan
        working-directory: infra/envs/${{ matrix.environment }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Comment the plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_DIR: infra/envs/${{ matrix.environment }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            let plan = '';
            try { plan = fs.readFileSync(`${process.env.PLAN_DIR}/plan.txt`, 'utf8'); } catch { plan = '(no plan output)'; }
            const summary = (plan.match(/^Plan: .*$/m) || plan.match(/^No changes\..*$/m) || ['See the job log'])[0];
            const max = 60000;
            if (plan.length > max) plan = '...(truncated, see the job log)\n' + plan.slice(-max);
            const marker = `<!-- terraform-plan-${env} -->`;
            const icon = process.env.OUTCOME === 'success' ? '✅' : '❌';
            const body = `${marker}\n### ${icon} Terraform plan: \`${env}\`\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`text\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
